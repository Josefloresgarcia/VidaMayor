name: Publicar vista previa web

# Publica la carpeta www/ como página web en GitHub Pages.
# Se ejecuta sola cada vez que cambia la app en la rama main (o a mano con "Run workflow").
# Primero hay que activar Pages: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar la carpeta www
        uses: actions/upload-pages-artifact@v4
        with:
          path: www

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
